name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, unit + integration tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: syncboard
          POSTGRES_PASSWORD: syncboard
          POSTGRES_DB: syncboard
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U syncboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://syncboard:syncboard@localhost:5434/syncboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test:unit
      - name: Integration tests (REST, concurrency, Socket.IO, reconnection) against PostgreSQL
        run: npm run test:integration
      - name: Build server and client
        run: npm run build

  e2e:
    name: Playwright multi-browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: syncboard
          POSTGRES_PASSWORD: syncboard
          POSTGRES_DB: syncboard
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U syncboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build server and client images
        run: docker compose build
      - name: Start the stack and wait for health
        run: |
          cp .env.example .env
          docker compose up -d
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/health/ready && break
            sleep 2
          done
          curl -fsS http://localhost:8080/api/v1/config
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
